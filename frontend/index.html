<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>村上春樹プレイリスト</title>
  <meta name="description" content="いまの気分を書くと、村上春樹の小説に登場する音楽から一曲だけ選びます。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Shippori+Mincho:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="grooves" aria-hidden="true"></div>

  <header class="top">
    <p class="wordmark" lang="en">Haruki Murakami Playlist</p>
    <p class="side"><span lang="en" id="side-letter">Side A</span><span id="side-name">気分</span></p>
  </header>

  <main>
    <!-- A面: 気分を書く -->
    <section id="ask" class="ask">
      <h1>いまの気分を、<br>聞かせてください。</h1>
      <p class="lede">小説のなかで鳴っていた音楽から、一曲だけ選びます。</p>

      <form id="mood-form" novalidate>
        <label class="visually-hidden" for="mood-text">いまの気分</label>
        <textarea id="mood-text" name="text" rows="1" maxlength="500" enterkeyhint="send"
          placeholder="雨の日曜の午後、何もする気が起きない"></textarea>
        <div class="form-foot">
          <p id="status" class="status" role="status" aria-live="polite"></p>
          <button type="submit" id="submit" class="go">
            <span>一曲えらぶ</span>
            <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M3 10h13M11 5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </form>

      <p class="examples" id="examples">
        <span class="examples-label">たとえば</span>
        <button type="button">眠れない夜、ひとりで考えごと</button>
        <button type="button">仕事で疲れて、とにかく癒されたい</button>
        <button type="button">天気がいいので遠くまでドライブしたい</button>
        <button type="button">昔の恋人をふと思い出した</button>
      </p>
    </section>

    <!-- B面: 一曲 -->
    <section id="answer" class="answer" hidden>
      <p class="quote" id="quote"></p>

      <article class="record">
        <div class="visual">
          <div class="disc" aria-hidden="true"><div class="disc-face"></div></div>
          <div class="sleeve" id="sleeve">
            <div class="sleeve-type" aria-hidden="true" lang="en">
              <span id="sleeve-artist"></span>
              <span id="sleeve-title"></span>
            </div>
            <img id="artwork" alt="">
          </div>
        </div>

        <div class="notes">
          <p class="genre" id="genre"></p>
          <h2 id="song-title"></h2>
          <p class="byline"><span id="song-original" lang="en"></span><span id="song-artist"></span></p>

          <div class="source">
            <div class="book" id="book">
              <div class="book-type" aria-hidden="true">
                <span id="book-title"></span>
                <span class="book-author">村上春樹</span>
              </div>
              <img id="cover" alt="">
            </div>
            <div>
              <p class="source-label">この曲が流れる小説</p>
              <p class="work" id="song-work"></p>
              <p class="scene" id="song-scene"></p>
            </div>
          </div>

          <p class="links">
            <a id="listen" target="_blank" rel="noopener noreferrer">YouTubeで探す</a>
            <a id="apple" target="_blank" rel="noopener noreferrer" hidden>Apple Musicで聴く</a>
            <a id="source" target="_blank" rel="noopener noreferrer">情報の出典</a>
            <span class="unverified" id="unverified" hidden>場面は要確認</span>
          </p>
        </div>
      </article>

      <div class="again">
        <button type="button" id="again" class="go ghost">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M17 10H4M9 5l-5 5 5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>別の気分で、もう一曲</span>
        </button>
      </div>
    </section>
  </main>

  <footer class="colophon">
    <p>曲と場面の情報は公開されている資料をもとにまとめたもので、小説本文の引用ではありません。</p>
    <p>書影: <a href="https://openlibrary.org/" target="_blank" rel="noopener noreferrer">Open Library</a>　ジャケット: Apple Music</p>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
