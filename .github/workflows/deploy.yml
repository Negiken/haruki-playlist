name: Deploy

# main に push されるたびに、テスト → インフラ適用 → アプリ配置 → 動作確認 まで自動で行う。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同時に2つのデプロイが走らないようにする（途中のデプロイは中断しない）
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
  STACK_NAME: haruki-playlist
  RELEASE_ID: ${{ github.sha }}

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write # OIDC で AWS のロールを引き受ける
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: AWS 認証（OIDC・長期キーなし）
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: インフラを適用（変更が無ければ何もしない）
        run: |
          prefix_list_id=$(aws ec2 describe-managed-prefix-lists \
            --filters Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing \
            --query 'PrefixLists[0].PrefixListId' --output text)
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/app.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides "CloudFrontPrefixListId=$prefix_list_id" \
            --no-fail-on-empty-changeset

      - name: スタックの出力を読む
        id: stack
        run: |
          output() {
            aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          {
            echo "site_url=$(output SiteUrl)"
            echo "distribution_id=$(output DistributionId)"
            echo "instance_id=$(output InstanceId)"
            echo "bucket=$(output ArtifactBucketName)"
          } >> "$GITHUB_OUTPUT"

      - name: Claude の APIキーを Parameter Store に登録
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::シークレット ANTHROPIC_API_KEY が未設定です。ルールベースのみで動作します。"
            exit 0
          fi
          aws ssm put-parameter --name /haruki-playlist/anthropic-api-key \
            --type SecureString --overwrite --value "$ANTHROPIC_API_KEY" > /dev/null

      - name: 成果物をまとめて S3 に置く
        run: |
          tar czf release.tar.gz backend/app backend/data backend/requirements.txt frontend scripts
          aws s3 cp release.tar.gz "s3://${{ steps.stack.outputs.bucket }}/releases/$RELEASE_ID.tar.gz" --only-show-errors

      - name: インスタンスが SSM に接続するのを待つ
        run: |
          for i in $(seq 1 60); do
            status=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${{ steps.stack.outputs.instance_id }}" \
              --query 'InstanceInformationList[0].PingStatus' --output text)
            [ "$status" = "Online" ] && exit 0
            sleep 10
          done
          echo "::error::インスタンスが SSM に接続しません"
          exit 1

      - name: EC2 上で配置・再起動（失敗時は前のリリースに自動で戻る）
        run: |
          release_dir="/opt/haruki-playlist/releases/$RELEASE_ID"
          command_id=$(aws ssm send-command \
            --instance-ids "${{ steps.stack.outputs.instance_id }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy $RELEASE_ID" \
            --parameters "{\"executionTimeout\":[\"900\"],\"commands\":[
              \"set -euo pipefail\",
              \"export AWS_DEFAULT_REGION=$AWS_REGION\",
              \"mkdir -p $release_dir\",
              \"aws s3 cp s3://${{ steps.stack.outputs.bucket }}/releases/$RELEASE_ID.tar.gz /tmp/release.tar.gz --only-show-errors\",
              \"tar xzf /tmp/release.tar.gz -C $release_dir\",
              \"rm -f /tmp/release.tar.gz\",
              \"bash $release_dir/scripts/remote_deploy.sh $RELEASE_ID\"
            ]}" \
            --query Command.CommandId --output text)

          for i in $(seq 1 90); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "${{ steps.stack.outputs.instance_id }}" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "${{ steps.stack.outputs.instance_id }}" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          if [ "$status" != "Success" ]; then
            echo "::error::EC2 上のデプロイが失敗しました（状態: $status）"
            exit 1
          fi

      - name: CloudFront のキャッシュを無効化
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.stack.outputs.distribution_id }}" --paths '/*' > /dev/null

      - name: 公開URLで動作確認
        run: |
          url="${{ steps.stack.outputs.site_url }}"
          for i in $(seq 1 30); do
            health=$(curl -fsS "$url/api/health" || true)
            if grep -q "\"version\":\"$RELEASE_ID\"" <<< "$health"; then
              result=$(curl -fsS -X POST "$url/api/recommendations" \
                -H 'Content-Type: application/json' -d '{"text":"デプロイ後の動作確認","count":1}')
              grep -q '"songs":\[{' <<< "$result"
              echo "### デプロイ完了 :musical_note:" >> "$GITHUB_STEP_SUMMARY"
              echo "$url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::公開URLの動作確認に失敗しました: $url"
          exit 1
